  api:
    build:
      context: .
      target: development
    ports:
      - "8003:8003"
    env_file:
      - .env
    environment:
      DATABASE_HOST: host.docker.internal
      DATABASE_PORT: 5436
      DATABASE_NAME: joineazy_unified
      DATABASE_USERNAME: joineazy_user
      DATABASE_PASSWORD: joineazy_pass
      DB_SYNC: alter
      AUTO_SEED: "true"
    volumes:
      - .:/app
      - /app/node_modules
      - ./logs:/app/logs
